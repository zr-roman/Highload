# Checks the manifests of the stand before Argo CD sees them: every resource kustomize renders from deploy/k8s, the
# Argo CD Applications and the SealedSecrets, against the API schemas of Kubernetes and of the CRDs in use (CNPG,
# Prometheus Operator, Traefik, Argo CD, Sealed Secrets). A misspelt field, a string where a number goes, a field this
# Kubernetes version does not have: without this check such a mistake shows only as a failed sync in Argo CD, after the
# push. A workflow of its own, not a job in backend-ci.yml: backend-ci.yml ignores deploy/**, and here deploy/** is all that matters.
name: Manifests

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/manifests.yml"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/manifests.yml"

permissions:
  contents: read

env:
  # The tarballs of these versions are checked against the hashes taken from their releases when the versions were
  # set: a downloaded binary runs in CI. A new version needs a new hash (checksums file of the release).
  KUSTOMIZE_VERSION: "5.8.3"
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # The Kubernetes of the cluster (k3s v1.35).
  KUBERNETES_VERSION: "1.35.0"

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          curl -sSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum --check
          tar xzf kubeconform.tar.gz kubeconform
          tar xzf kustomize.tar.gz kustomize
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # -strict: a field the schema does not know is an error, not ignored, so a misspelt optional field is caught too.
      # The schemas of the CRDs come from the community catalog datreeio/CRDs-catalog; a kind it lacks fails the
      # check rather than being skipped, so a new CRD has to be thought about, not let through unchecked.
      - name: Validate
        run: |
          check() {
            kubeconform -strict -summary -output pretty \
              -kubernetes-version "$KUBERNETES_VERSION" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$@"
          }
          echo "::group::deploy/k8s (as kustomize renders it for Argo CD)"
          kustomize build deploy/k8s | check -
          echo "::endgroup::"
          echo "::group::deploy/argocd, deploy/cluster and deploy/monitoring/secrets"
          check deploy/argocd deploy/cluster deploy/monitoring/secrets
          echo "::endgroup::"
