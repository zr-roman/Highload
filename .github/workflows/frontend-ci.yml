name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "frontend/**"
      - "deploy/ci-release.py"
      - ".github/scripts/detect-changes.py"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/zr-roman

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch pull request head
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
      - id: detect
        run: python3 .github/scripts/detect-changes.py

  build:
    name: React build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image-check:
    name: Frontend container build
    needs: [changes, build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: frontend:check
          cache-from: type=gha,scope=frontend

  frontend-check:
    name: Frontend checks
    if: always()
    needs: [changes, build, image-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend build and image
        env:
          DETECT_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image-check.result }}
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Change detection did not succeed."
            exit 1
          fi

          if [[ "$FRONTEND_CHANGED" != "true" ]]; then
            echo "No frontend changes; frontend checks are not needed."
            exit 0
          fi

          for result in "$BUILD_RESULT" "$IMAGE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required frontend check did not succeed: $result"
              exit 1
            fi
          done

  publish:
    name: Publish frontend image
    needs: [changes, build, image-check]
    if: needs.changes.outputs.frontend == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.image-check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TRIVY_VERSION: "0.72.0"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Scan with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy aquasec/trivy:${TRIVY_VERSION} image \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            "$REGISTRY/frontend:${{ steps.tag.outputs.tag }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy aquasec/trivy:${TRIVY_VERSION} image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet --skip-db-update \
            "$REGISTRY/frontend:${{ steps.tag.outputs.tag }}"
      - name: Push
        id: push
        run: |
          image="$REGISTRY/frontend:${{ steps.tag.outputs.tag }}"
          docker push "$image"
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"
      - name: SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy -v "$PWD:/out" \
            aquasec/trivy:${TRIVY_VERSION} image --format cyclonedx --output /out/sbom.cdx.json --quiet \
            "$REGISTRY/frontend:${{ steps.tag.outputs.tag }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.push.outputs.ref }}"

  release:
    name: Update frontend tag in git
    needs: [changes, publish]
    if: always() && needs.changes.outputs.frontend == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Commit the frontend tag
        run: |
          tag="${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python3 deploy/ci-release.py apply "$tag" frontend
            if git diff --quiet -- deploy/k8s/kustomization.yaml; then
              echo "Frontend already has this tag or a newer one"
              exit 0
            fi
            git commit -m "Release: frontend $tag (CI)" -- deploy/k8s/kustomization.yaml
            git push && exit 0
          done
          exit 1
