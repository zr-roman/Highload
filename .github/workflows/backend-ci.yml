# Backend CI: test the platform when backend code, tests, shared build files or release logic change. On main, also
# build and push images for services whose sources changed, then commit their new tags. Argo CD picks the commit up
# and rolls the pods (docs/gitops.md): CI never talks to the cluster, git is the only way in.
name: Backend CI

on:
  push:
    branches: [main]
    # Frontend and docs have their own workflow or need no tests. Manifests are checked by manifests.yml.
    paths:
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/detect-changes.py"
      - ".dockerignore"
      - "src/**"
      - "tests/**"
      - "db/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "payments-platform.slnx"
      - "deploy/ci-release.py"
  # Run on every PR so the stable summary check exists even when backend jobs are skipped.
  pull_request:
  # By hand, from the Actions tab: releases every service whose image is behind its sources, like a push would.
  workflow_dispatch:

# A newer push to the same branch cancels the older run: the newer one releases everything the older one would have
# (deploy/ci-release.py compares with the commit of each current image, not with the previous push).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/zr-roman

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch pull request head
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
      - id: detect
        run: python3 .github/scripts/detect-changes.py

  dotnet:
    name: .NET tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Testcontainers starts Postgres, Kafka and Redis in the Docker of the runner, as on the laptop.
      - run: dotnet test

  go:
    name: Bank emulator tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bank-emulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/bank-emulator/go.mod
          cache: false # standard library only: nothing to cache
      - run: go vet ./...
      # -race needs a C compiler: there is none on the laptop, here there is.
      - run: go test -race ./...

  python:
    name: Antifraud tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/antifraud-service
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  backend-check:
    name: Backend checks
    if: always()
    needs: [changes, dotnet, go, python]
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend checks
        env:
          DETECT_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          GO_RESULT: ${{ needs.go.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Change detection did not succeed."
            exit 1
          fi

          if [[ "$BACKEND_CHANGED" != "true" ]]; then
            echo "No backend changes; backend checks are not needed."
            exit 0
          fi

          for result in "$DOTNET_RESULT" "$GO_RESULT" "$PYTHON_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required backend test job did not succeed: $result"
              exit 1
            fi
          done

  plan:
    name: What to release
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits the current tags name
      - id: plan
        run: python3 deploy/ci-release.py plan frontend

  images:
    name: Image ${{ matrix.service }}
    needs: [changes, dotnet, go, python, plan]
    if: always() && needs.changes.outputs.backend == 'true' && needs.dotnet.result == 'success' && needs.go.result == 'success' && needs.python.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # the OIDC token of this run, which cosign signs with instead of a key
    env:
      TRIVY_VERSION: "0.72.0"
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # The tag is the commit, as with deploy/release.ps1: 12 characters of the SHA.
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Built into the local Docker first, not pushed: the scan below decides whether the image goes to the registry.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          # Layers between runs in the GitHub Actions cache, one scope per service.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      # Known vulnerabilities of the image: its base and its packages. A critical one that has a fix stops the
      # release; one without a fix only shows in the log, since nothing could be done about it yet.
      # Trivy runs from its image at a fixed version, not from trivy-action and not latest: in March 2026 the action's
      # tags and the latest image were replaced with ones that stole CI secrets. The first run shows HIGH and CRITICAL,
      # the second fails on CRITICAL alone; the vulnerability database is downloaded once, into a shared cache.
      - name: Scan with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy aquasec/trivy:${TRIVY_VERSION} image \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            "$REGISTRY/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy aquasec/trivy:${TRIVY_VERSION} image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet --skip-db-update \
            "$REGISTRY/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
      - name: Push
        id: push
        run: |
          image="$REGISTRY/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
          docker push "$image"
          # The signature and the SBOM name the image by its digest, not by its tag: a tag can be moved to another image.
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"
      # A full version: the action publishes no major tag (v4), only releases such as v4.1.3.
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      # Keyless signature: no key to keep or leak. cosign trades the OIDC token of this run for a short-lived
      # certificate from Fulcio that names this repository, this workflow and this branch, signs the digest with it and
      # writes the signature to the public log Rekor. The signature goes to GHCR next to the image. Checking it
      # (docs/security.md): cosign verify with the identity of this workflow.
      - name: Sign
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"
      # SBOM: the packages of the image, from the OS to NuGet, pip and Go modules, as CycloneDX. Attached to the image
      # as a signed attestation, so when a new CVE comes out the question "which images have this package" is answered
      # from the registry, without pulling and scanning every image again.
      - name: SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy -v "$PWD:/out" \
            aquasec/trivy:${TRIVY_VERSION} image --format cyclonedx --output /out/sbom.cdx.json --quiet \
            "$REGISTRY/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.push.outputs.ref }}"

  release:
    name: Tags to git
    needs: [changes, plan, images]
    if: always() && needs.changes.outputs.backend == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.services != '' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # deploy/ci-release.py compares the new commit with the commit of the current image
      - name: Commit the new tags
        run: |
          tag="${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          services="${{ needs.plan.outputs.services }}"
          # The tags are written onto the latest main, again on every attempt: someone, or a run of a newer commit,
          # may have pushed in the meantime. ci-release.py leaves a service alone if its current image is from a newer
          # commit than this run's, so a run that finishes late never rolls an image back.
          # A push made with GITHUB_TOKEN starts no new workflow run, so the release does not trigger CI again.
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python3 deploy/ci-release.py apply "$tag" $services
            if git diff --quiet -- deploy/k8s/kustomization.yaml; then
              echo "Nothing to release: the images are from this commit or a newer one"
              exit 0
            fi
            git commit -m "Release: ${services// /, } $tag (CI)" -- deploy/k8s/kustomization.yaml
            git push && exit 0
          done
          exit 1
