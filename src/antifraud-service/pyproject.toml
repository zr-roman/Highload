[project]
name = "antifraud"
version = "0.1.0"
description = "Antifraud check for Payments.Api: allow or deny a payment after the bank authorized it"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16.0",
    "ruff>=0.8",
    "fakeredis>=2.40.0",
    "pytest-asyncio>=1.4.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# async def tests and fixtures run on the event loop without a marker on each of them
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
