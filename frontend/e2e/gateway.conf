# The production frontend serves static assets on 8080. Mirror the stand's ingress on a second port.
server {
    listen 8081;
    location /payments { proxy_pass http://payments:8080; }
    location /balances { proxy_pass http://ledger:8080; }
    location = /invariants { proxy_pass http://ledger:8080; }
    location / { proxy_pass http://127.0.0.1:8080; }
}
