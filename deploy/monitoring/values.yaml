# kube-prometheus-stack for the k3d stand on a laptop: Prometheus, Grafana, the Prometheus Operator, kube-state-metrics
# and node-exporter. Installed by Argo CD from git (deploy/argocd/monitoring.yaml); this file is its Helm values.
# Trimmed for one machine: short retention, modest memory, alerts to one Telegram chat.

# Short resource names: monitoring-grafana, monitoring-prometheus and so on.
fullnameOverride: monitoring

# Alertmanager sends what fires to Telegram, to the bot @HighloadAlert192832Bot; the alerts are also seen in its UI
# and in Grafana, which gets an Alertmanager data source from the chart. The rules are the stand's own
# (deploy/k8s/alerts.yaml).
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    # Alerts of one name in one namespace come as one message; a new one joins its group within 5 minutes.
    # A critical alert that keeps firing is repeated every hour, a warning every 4 hours; "resolved" comes too.
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: telegram
          repeat_interval: 1h
    # A critical alert silences the warning of the same name and namespace: one message about one problem.
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: [alertname, namespace]
    receivers:
      - name: telegram
        telegram_configs:
          # The token of the bot is a SealedSecret (secrets/alertmanager-telegram-sealed.yaml), mounted by
          # alertmanagerSpec.secrets below; the chat is not a secret: without the token nothing can be sent to it.
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id: 153087793
            send_resolved: true
  alertmanagerSpec:
    secrets: [alertmanager-telegram]
    # On the server node, like Prometheus: an alert about a dead node must not die with it.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
# The chart's default rules (about 150) are written for kubeadm clusters: on k3s some of them fire forever about
# control-plane components it does not expose, and the rest overlap with deploy/k8s/alerts.yaml.
defaultRules:
  create: false

# k3s runs the control plane in one process and does not expose these components the way kubeadm does: their targets
# would be down forever.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
# The API server is up, but through it the one process of k3s exposes the metrics of its whole control plane: on
# 22.11.2026 about half of the 152 000 series of Prometheus (apiserver_*, etcd_request_*, scheduler_*, workqueue_*).
# The stand's dashboards and alerts use none of them. With them the WAL and the head of Prometheus, which count towards
# retentionSize, left no room for blocks: each block was deleted as soon as it was made (size retentions 10, blocks 0
# bytes), and Prometheus kept 1 to 3 hours instead of 12h. The price: no dashboard of the API server from the chart.
kubeApiServer:
  enabled: false

prometheus:
  prometheusSpec:
    # Enough to look at a run and compare it with the previous one; the disk of the laptop is tight.
    # Metrics of the services arrive pushed over OTLP from the OpenTelemetry Collector (deploy/k8s/otel-collector.yaml),
    # not scraped. OTLP batches can arrive a little late: without the out-of-order window Prometheus drops such points.
    enableOTLPReceiver: true
    tsdb:
      outOfOrderTimeWindow: 5m
    retention: 12h
    retentionSize: 1GB
    scrapeInterval: 15s
    # Pick up ServiceMonitors and PodMonitors from any namespace, not only those labelled for this Helm release:
    # the monitors of the stand live in deploy/k8s, next to the services they watch.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # The load experiments stop or drain an agent node (load/node-failure.ps1). Prometheus on that node would leave a
    # hole in the graphs exactly where the failure is, so it stays on the server node: without that node the cluster
    # has no API, so no experiment takes it down. kube-state-metrics, Grafana and the OpenTelemetry Collector
    # (deploy/k8s/otel-collector.yaml) live there too. In production: nodes of their own for monitoring, or Prometheus
    # in HA.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1500Mi

grafana:
  # The admin password from a Secret created by hand (deploy/k8s/README.md), not from the chart: the chart generates
  # a random one when none is given, and Argo CD renders the chart again for every new commit on main, so the password
  # would change, and Grafana would roll, with every push.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards come from git as ConfigMaps (label grafana_dashboard: "1"), so nothing in Grafana needs a disk.
  persistence:
    enabled: false
  sidecar:
    # The sidecars that collect dashboards and data sources ask Grafana to reload them after each change, signing the
    # request with the admin login from grafana-admin. They encode it in Latin-1 by default, so a password with
    # non-Latin letters (Cyrillic, say) breaks the request with UnicodeEncodeError; Grafana expects UTF-8 there.
    # Without the reload a changed dashboard still shows up within 30 seconds, when Grafana rescans the folder, but a
    # data source would not: Grafana reads data sources only at startup and on reload.
    dashboards:
      # The dashboards of the stand live in deploy/k8s, in namespace highload.
      searchNamespace: ALL
      env:
        REQ_BASIC_AUTH_ENCODING: utf-8
    datasources:
      env:
        REQ_BASIC_AUTH_ENCODING: utf-8
  defaultDashboardsTimezone: browser
  # On the server node, like Prometheus (prometheusSpec.nodeSelector).
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  # On the server node, like Prometheus (prometheusSpec.nodeSelector): the panels of nodes, replicas and HPA come from it.
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 24Mi
    limits:
      memory: 64Mi
