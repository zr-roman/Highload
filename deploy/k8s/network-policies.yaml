# Who may connect to whom inside namespace highload. Without these, every pod reaches every other: a compromised
# antifraud could read Kafka or call the bank in the name of Payments.Api. k3s enforces NetworkPolicy itself
# (the policy controller of kube-router is built in).
#
# Ingress only: each pod lists who may come in. Egress stays open: Postgres lives on the host
# (host.docker.internal), and an egress allow-list would need its address, DNS and the API server spelled out;
# the stores that matter (Kafka, Redis) are closed from the inside anyway. In production: egress too.
#
# Not covered by these and not needed: kubectl port-forward and exec go through the kubelet, not the pod network;
# probes come from the node, which kube-router lets through.

# Everything closed by default: a pod nobody lists below gets no connections at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The entry point: Traefik (kube-system) to the HTTP APIs and the dashboard UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-traefik
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [payments-api, ledger-service, dashboard]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080 # payments-api, ledger-service
        - port: 18888 # dashboard UI
---
# Redis: the rate limiter of Payments.Api and the velocity counters of antifraud.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments-api, antifraud]
      ports:
        - port: 6379
---
# Kafka: Payments.Api writes (outbox relay), Ledger.Service reads. The controller port 9093 is used inside the pod only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments-api, ledger-service]
      ports:
        - port: 9092
---
# The bank and the antifraud check are called by Payments.Api alone (antifraud from stage 4 on).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-payments-api
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bank-emulator, antifraud]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-api
      ports:
        - port: 5300 # bank-emulator
        - port: 8000 # antifraud
---
# Telemetry: the .NET services send OTLP to the Collector, the Collector sends it on to the dashboard.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments-api, ledger-service]
      ports:
        - port: 4317
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-otlp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 18889
---
# PostgreSQL (postgres.yaml): the services to their databases; the instances to each other (replication, and the
# status endpoint of the instance manager); the CloudNativePG operator to the instance manager; Prometheus to the
# metrics exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments-api, ledger-service]
      ports:
        - port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg
      ports:
        - port: 5432
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
