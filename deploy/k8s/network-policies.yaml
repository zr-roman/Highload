# Who may connect to whom inside namespace highload. Without these, every pod reaches every other: a compromised
# antifraud could read Kafka or call the bank in the name of Payments.Api. k3s enforces NetworkPolicy itself
# (the policy controller of kube-router is built in).
#
# Ingress here: each pod lists who may come in. Egress, where each pod may go, is in network-policies-egress.yaml.
#
# Not covered by these and not needed: kubectl port-forward and exec go through the kubelet, not the pod network;
# probes come from the node, which kube-router lets through.

# Everything closed by default: a pod nobody lists below gets no connections at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The entry point: Traefik (kube-system) to the HTTP APIs and the dashboard UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-traefik
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [payments-api, ledger-service, dashboard]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080 # payments-api, ledger-service
        - port: 18888 # dashboard UI
---
# Redis: the rate limiter of Payments.Api and the velocity counters of antifraud. The clients ask the Sentinels
# (26379) where the master is, then talk to it (6379); the copies replicate and the Sentinels watch each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments-api, antifraud, redis]
      ports:
        - port: 6379
        - port: 26379
---
# Kafka: no policy here. Strimzi makes its own (kafka.yaml): the listener 9092 for Payments.Api, which writes from the
# outbox, and Ledger.Service, which reads (networkPolicyPeers); the ports between the brokers and from the operator.
---
# The bank and the antifraud check are called by Payments.Api alone (antifraud from stage 4 on).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-payments-api
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bank-emulator, antifraud]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-api
      ports:
        - port: 5300 # bank-emulator
        - port: 8000 # antifraud
---
# Telemetry: the .NET services send OTLP to the Collector, the Collector sends it on to the dashboard.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments-api, ledger-service]
      ports:
        - port: 4317
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-otlp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 18889
---
# PostgreSQL (postgres.yaml): the services to their databases; the instances to each other (replication, and the
# status endpoint of the instance manager); the CloudNativePG operator to the instance manager; Prometheus to the
# metrics exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  # Every CloudNativePG cluster in the namespace: pg, and pg-restore during the recovery drill (load/pg-restore.yaml).
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments-api, ledger-service]
      ports:
        - port: 5432
    - from:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - port: 5432
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
---
# The object store of the backups (backup-store.yaml): only the PostgreSQL pods, where the Barman Cloud sidecar sends
# the WAL and the base backups, and the recovery job of a restored cluster, which reads them (cnpg.io/cluster on both);
# and the job that creates the bucket (backup-bucket.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-store
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backup-store
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backup-bucket
      ports:
        - port: 9000
