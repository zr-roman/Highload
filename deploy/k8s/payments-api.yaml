# Payments.Api (C#): accepts payments, calls the bank, writes the outbox and relays it to Kafka.
#   kubectl -n highload port-forward svc/payments-api 5100:8080   ->  the README's requests to http://localhost:5100
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
  annotations:
    # Traefik gives up on a pod after 1 s without a connection, not 30 (traefik.yaml).
    traefik.ingress.kubernetes.io/service.serverstransport: highload-fast-dial@kubernetescrd
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
spec:
  # No replicas here: hpa.yaml keeps their number between 2 and 4, and a number in this manifest would reset it on
  # every kubectl apply. At least two, so that losing one pod or one node leaves the other serving while a replacement
  # starts (pdb.yaml keeps one up through a drain). More replicas are safe: the schema, OutboxRelay and PaymentRecovery
  # each take an advisory lock in Postgres, so only one replica relays the outbox and recovers payments.
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
    spec:
      # Counted from the start of preStop: 5 s of the pause, then up to 30 s for the app to stop (HostOptions.ShutdownTimeout
      # is 25 s in Platform, a margin before SIGKILL).
      terminationGracePeriodSeconds: 35
      # The replicas on different nodes, so a node going down takes one of them, not both. ScheduleAnyway: with fewer
      # nodes than replicas, or one node cordoned, the pods still start, just not spread.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payments-api
      # A node that stops answering is marked not-ready after about 40 s; by default its pods are evicted and started
      # elsewhere only 5 minutes after that. 30 s here: the other replica carries the load meanwhile.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # Restricted, as the Pod Security Standard of the namespace demands (namespace.yaml, docs/security.md).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: payments-api
          image: payments-api:dev
          imagePullPolicy: IfNotPresent
          env:
            # Environment variables override appsettings.json: __ stands for the : of a configuration key.
            # PostgreSQL in the cluster (postgres.yaml): pg-rw always points at the current primary. The password is the
            # one CloudNativePG generated for the owner app (Secret pg-app): it never leaves the cluster. Kubernetes puts
            # it into the connection string below through $(PG_PASSWORD).
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: password
            # Timeout and Command Timeout: client-side limits of Npgsql, in seconds. When the primary's node dies, its
            # packets are dropped, not refused: without them a query on an open connection waits 30 s (the default
            # Command Timeout), and opening one waits 15 s; statement_timeout cannot help, the server is gone. With them
            # a request fails within seconds and frees its connection (docs/postgres-failover.md, «Опыт 3»).
            # Straight to the primary, not through PgBouncer: through it a switchover failed more payments, not fewer
            # (docs/postgres-failover.md, «PgBouncer: опыт»).
            - name: ConnectionStrings__Payments
              value: Host=pg-rw;Port=5432;Database=payments;Username=app;Password=$(PG_PASSWORD);Maximum Pool Size=16;Minimum Pool Size=16;Timeout=3;Command Timeout=5;Options=-c idle_in_transaction_session_timeout=15s -c statement_timeout=5s
            - name: ConnectionStrings__Kafka
              value: kafka-kafka-bootstrap:9092
            - name: ConnectionStrings__Redis
              # The Sentinels, not Redis itself: they say which copy is the master now, and the client follows a
              # failover on its own (redis.yaml).
              value: redis-0.redis:26379,redis-1.redis:26379,redis-2.redis:26379,serviceName=mymaster,connectTimeout=2000,syncTimeout=100,asyncTimeout=100
            - name: Acquirer__BaseAddress
              value: http://bank-emulator:5300/
            # Port 8000 of the antifraud Service (antifraud.yaml); NetworkPolicy from-payments-api lets this pod in.
            - name: Antifraud__BaseAddress
              value: http://antifraud:8000/
            # Pause of the outbox relay after each published batch (Outbox/OutboxOptions.cs). 0: no pause.
            # For the catch-up experiment: "1000" with batches of 500 is about 250 messages a second,
            # still above the 200 a second that come in.
            - name: Outbox__BusyDelayMs
              value: "0"
            # To the OpenTelemetry Collector (otel-collector.yaml), which sends metrics on to Prometheus and everything
            # to the Aspire dashboard.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            # Metrics every 15 s, as often as Prometheus scrapes the rest; the default of 60 s draws one point a minute.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # The pod's name as the instance in telemetry (src/Platform/TelemetryExtensions.cs): a container restarted
            # in the same pod continues its series in Prometheus instead of starting new ones.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 1 % of traces, as the load matrix runs the services (load/Matrix/Stand.cs): a trace of every request
            # is thousands of spans a second for the dashboard on the same laptop, and it shows in the latency.
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.01"
          ports:
            - name: http
              containerPort: 8080
          # startup: until the app has applied the schema, created the topic and connected to Redis (Program.cs),
          # the other probes wait.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # readiness: the process answers, as liveness; no check of Postgres. A shared dependency in readiness takes every
          # replica out at once: when the node of the primary died, the healthy replicas left the balancer within seconds,
          # while the replica on the dead node still counted as ready until the node was NotReady, and Traefik sent it
          # everything (docs/postgres-failover.md, «Опыт 3»). Without Postgres a request fails with 500 within the
          # connection timeout (Timeout=3), and the replica takes requests again the moment pg-rw has a new primary.
          # Postgres is checked at start: the service does not listen on HTTP until its schema is applied (Program.cs).
          # /health/ready stays for the load matrix (load/Matrix/Stand.cs).
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness: the process answers, no dependency checks: with Postgres down it would restart every pod at once,
          # and none could start again until Postgres came back.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Kubernetes removes the pod from the Service and sends SIGTERM at the same moment, but Traefik learns of the
          # removal later and keeps sending requests for a while: the pod keeps serving them for 5 more seconds and
          # gets SIGTERM only after that. The sleep action, not exec sleep: the chiseled image has no shell and no sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Restricted (docs/security.md): the process cannot gain privileges beyond those it starts with.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The one writable place: /tmp, for the runtime's own files (.NET diagnostics, Python temp files).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            # No CPU limit: throttling within the 100 ms CFS period shows up as latency spikes.
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              memory: 512Mi
