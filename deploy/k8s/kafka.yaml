# Kafka of the stand, run by Strimzi (deploy/argocd/strimzi.yaml): three nodes on three nodes of the cluster, each
# both broker and KRaft controller. The quorum of three controllers and three replicas of every partition survive the
# loss of any one node.
#
# The services connect to the Service kafka-kafka-bootstrap:9092; the client then talks to the broker that leads each
# partition, at the address that broker advertises (kafka-broker-N.kafka-kafka-brokers).
#
# A write is safe when two of three brokers have it: min.insync.replicas 2 with acks=all of the producer of
# Payments.Api (Program.cs). The outbox row is deleted only after that. One broker down: writes go on. Two down: the
# producer is refused, the outbox keeps the payments in PostgreSQL until a second broker is back — nothing is lost,
# the Ledger lags (alert OutboxBacklog). The same choice as dataDurability: required of PostgreSQL (postgres.yaml).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        # local-path of k3s: a folder on the node. The volume stays when the cluster is deleted: deleteClaim false.
        size: 1Gi
        deleteClaim: false
        # The KRaft metadata log on the same volume as the partitions.
        kraftMetadata: shared
  # The heap is small: the stand writes a few hundred small messages a second. The rest of the memory is the page
  # cache, which Kafka reads and writes through.
  jvmOptions:
    -Xms: 320m
    -Xmx: 320m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 768Mi
  template:
    pod:
      # One broker per node, like the instances of PostgreSQL: a node going down takes one replica of a partition,
      # never two, so min.insync.replicas 2 still holds.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: kafka
                  strimzi.io/pool-name: broker
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
spec:
  kafka:
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
      # Plain text inside the cluster, as before. Strimzi makes a NetworkPolicy for every listener; the peers below
      # narrow it to the two services (docs/security.md), and to the brokers themselves: the Kafka tools run in a
      # broker's pod (kafka-topics.sh, kafka-consumer-groups.sh) reach the other brokers through this listener.
      - name: plain
        port: 9092
        type: internal
        tls: false
        networkPolicyPeers:
          - podSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [payments-api, ledger-service]
          - podSelector:
              matchLabels:
                strimzi.io/cluster: kafka
                strimzi.io/pool-name: broker
          # The pod of the Kafka tools that load/Failover starts for the length of a run (KafkaProbe.cs).
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: kafka-probe
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      group.initial.rebalance.delay.ms: 0
      # Topics are declared below (KafkaTopic) or created by the services with the broker's defaults.
      auto.create.topics.enable: false
      # The disk is tight: at most ~64 MB per partition and an hour, small segments so old ones can be deleted.
      log.retention.bytes: 67108864
      log.segment.bytes: 16777216
      log.retention.hours: 1
  # The Topic Operator keeps the KafkaTopic resources and the topics in Kafka in step. No User Operator: no users,
  # the listener has no authentication.
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 20m
          memory: 192Mi
        limits:
          memory: 256Mi
    template:
      pod:
        # With the rest of the infrastructure, on the server node: the experiments stop agent nodes.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: In
                      values: ["true"]
---
# The topic of captured payments: Payments.Api writes it from the outbox, Ledger.Service reads it. Declared here so
# that its replication is in git; the services still call CreateTopics at start (Platform/KafkaTopics.cs) and get
# TopicAlreadyExists.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payments-captured
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: payments.captured
  # Contracts/Topics.cs: PaymentsCapturedPartitions. The Ledger scales up to this many consumers.
  partitions: 8
  replicas: 3
  config:
    min.insync.replicas: 2
