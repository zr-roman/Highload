# One Kafka node in KRaft mode, as in docker-compose.yml: the same process is broker and controller.
# A StatefulSet, so the pod has a stable name (kafka-0) and keeps its volume across restarts.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  # Headless: the name kafka resolves straight to the pod's IP, and kafka-0.kafka is the pod's own name,
  # which the broker advertises to the clients.
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # Without this Kubernetes adds KAFKA_PORT, KAFKA_SERVICE_HOST and the like for the Service named kafka,
      # and the image turns every KAFKA_* variable into a broker setting.
      enableServiceLinks: false
      containers:
        - name: kafka
          # Not 4.0.0: see docker-compose.yml (KAFKA-19888).
          image: apache/kafka:4.3.2
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # The address clients get back from the bootstrap server and then connect to:
            # the pod's own DNS name, reachable from every pod of the cluster.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.highload.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Topics are created by the services with the right number of partitions.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # The disk is tight: at most ~64 MB per partition, small segments so old ones can be deleted.
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "67108864"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "16777216"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "1"
            # On the volume, not in /tmp of the container: the log survives a restart of the pod.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
          # The broker accepts connections: the services may start creating the topic.
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # local-path, the default storage class of k3s: a folder on the node.
        resources:
          requests:
            storage: 1Gi
