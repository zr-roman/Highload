# Standalone Aspire dashboard: traces, metrics and logs over OTLP, as in docker-compose.yml.
# The UI is not exposed outside the cluster:
#   kubectl -n highload port-forward svc/dashboard 18888:18888   ->  http://localhost:18888
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: ui
      port: 18888
    - name: otlp-grpc
      port: 18889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      # Restricted, as the Pod Security Standard of the namespace demands (namespace.yaml, docs/security.md).
      # The image names its user (app, uid 1654 in .NET images), Kubernetes needs the number.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Since 13.6 the dashboard keeps its telemetry in SQLite, not in memory. Run standalone, it is in persistence
        # mode None: a temporary database in the temp directory, here, deleted when the dashboard stops. 64Mi, enough
        # for the runtime's own files, had the pod evicted every few hours, and the telemetry went with it
        # (docs/observability.md, «Чему научил мониторинг»). 1Gi until the size of the database under load is
        # measured; then Dashboard__TelemetryLimits__* keep it well inside.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      containers:
        - name: dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
          env:
            - name: DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS
              value: "true"
          ports:
            - name: ui
              containerPort: 18888
            - name: otlp-grpc
              containerPort: 18889
          # Restricted (docs/security.md): the process cannot gain privileges beyond those it starts with.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The one writable place: /tmp, for the .NET diagnostics socket and the telemetry database (volumes above).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
