# Alerting rules of the stand. The Prometheus Operator turns this PrometheusRule into Prometheus rules; Prometheus
# picks it up from any namespace (ruleSelectorNilUsesHelmValues in deploy/monitoring/values.yaml) and sends what fires
# to Alertmanager. Nobody is paged on a laptop: Alertmanager keeps the alerts for its UI and for Grafana.
#
# Each alert answers "is someone affected, or about to be", not "is something unusual": an alert nobody acts on
# teaches people to ignore the rest. Prometheus evaluates the rules every 30 s, so an alert fires up to 30 s after
# its condition plus "for".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: highload
spec:
  groups:
    - name: highload.entry
      rules:
        # The earliest sign of a dead pod: Traefik's attempts to Payments.Api fail with 502/504 while the client still
        # gets its answers, because the retry middleware sends the request to another pod (deploy/k8s/traefik.yaml).
        # Kubernetes needs ~15 s more to call the node NotReady (node-monitor-grace-period, deploy/k8s/README.md).
        # A warning, not critical: nobody is affected yet, but the retries are using up the spare capacity.
        - alert: PaymentsApiAttemptsFailing
          expr: |
            sum(rate(traefik_service_requests_total{service=~"highload-payments-api.*", code=~"502|504"}[1m])) > 1
          for: 15s
          labels:
            severity: warning
          annotations:
            summary: "Traefik cannot reach a Payments.Api pod: {{ $value | humanize }} failed attempts a second"
            description: >-
              Attempts fail and are retried on another pod; clients do not see it yet.
              Usually a pod on a dead node that is still in the Service.

        # What the client actually sees. 1 % for a minute: a few 5xx during a rolling update stay below it.
        - alert: ClientErrorsHigh
          expr: |
            sum(rate(traefik_entrypoint_requests_total{entrypoint="web", code=~"5.."}[2m]))
              / sum(rate(traefik_entrypoint_requests_total{entrypoint="web"}[2m])) > 0.01
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value | humanizePercentage }} of the answers to clients are 5xx"

    - name: highload.async
      rules:
        # Payments are taken but do not reach the Ledger: Kafka is down or the relay is stuck. Normally the oldest
        # message waits well under a second. The gauge comes over OTLP and has no staleness marker: after the relay's
        # pod dies, Prometheus keeps its last value for 5 minutes (docs/observability.md, lesson 7).
        - alert: OutboxBacklog
          expr: max(payments_outbox_oldest_age_seconds) > 60
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "The oldest payment in the outbox has waited {{ $value | humanizeDuration }}"
            description: Balances lag behind payments. Check Kafka and the outbox relay of Payments.Api.

    - name: highload.backups
      rules:
        # WAL segments that do not reach the object store: the backups stop at the last archived segment, and the
        # segments pile up on the primary's disk until it is full (deploy/k8s/backups.yaml). From pg_stat_archiver,
        # through the exporter of CloudNativePG.
        - alert: PostgresWalArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pod }} cannot archive WAL"
            description: "Recovery from backup reaches only to the last archived segment. kubectl -n highload logs {{ $labels.pod }} -c plugin-barman-cloud"

        # The daily base backup (ScheduledBackup pg-daily, 03:00) stopped. The WAL archive goes on without it, so
        # PostgresWalArchivingFailing stays quiet; but a recovery then replays the WAL of every day since the last
        # backup, and once that backup is past the retention of 7 days there is nothing to recover from.
        # The times come from the Barman Cloud plugin: with backups by a plugin, the same metrics of the operator
        # itself (cnpg_collector_last_available_backup_timestamp) stay 0. Every instance reports the same value.
        # 26 h: a day between backups and room for a long one. No metric at all is an alert too: the plugin or its
        # scraping is gone, and so is the only way to know.
        - alert: PostgresBackupTooOld
          expr: |
            time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="highload"}) > 26 * 3600
              or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="highload"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "The last base backup of PostgreSQL is older than 26 hours"
            description: "kubectl -n highload get backup --sort-by=.status.stoppedAt; kubectl -n highload get scheduledbackup pg-daily"

        # A backup failed after the last one that worked: at once, not a day later.
        - alert: PostgresBackupFailed
          expr: |
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="highload"})
              > max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="highload"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The last base backup of PostgreSQL failed"
            description: "kubectl -n highload get backup --sort-by=.status.stoppedAt; kubectl -n highload describe backup <the last one>"

    - name: highload.cluster
      rules:
        # From kube-state-metrics, which stays on the server node (deploy/monitoring/values.yaml): a stopped agent
        # node does not take its own alert down with it.
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not Ready"
            description: Pods on it are evicted 30 s after NotReady (tolerationSeconds in payments-api.yaml).

        # A container that keeps falling over. Restarts alone are not enough: Kafka and the Ledger restart once
        # when their node comes back, and that is recovery, not a problem.
        - alert: PodCrashLooping
          expr: |
            max by (namespace, pod, container) (
              kube_pod_container_status_waiting_reason{namespace="highload", reason="CrashLoopBackOff"}) == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff"
            description: "kubectl -n highload logs {{ $labels.pod }} --previous"
