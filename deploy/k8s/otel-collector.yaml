# OpenTelemetry Collector: the services send all their telemetry here over OTLP, and the collector decides where it goes.
# Metrics go to Prometheus (stored, for Grafana) and to the Aspire dashboard; traces and logs go to the Aspire
# dashboard only. The services know nothing of Prometheus: where telemetry goes is the platform's business, not theirs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          # 0.0.0.0, not the default localhost: the services connect from other pods.
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # Refuses data before the container runs out of memory (limit 256Mi), instead of being killed by it.
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      batch: {}
    exporters:
      otlp/aspire:
        endpoint: dashboard:18889
        tls:
          insecure: true
      # The OTLP receiver of Prometheus 3 (enableOTLPReceiver in deploy/monitoring/values.yaml).
      otlphttp/prometheus:
        metrics_endpoint: http://monitoring-prometheus.monitoring.svc:9090/api/v1/otlp/v1/metrics
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/prometheus, otlp/aspire]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/aspire]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/aspire]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
      annotations:
        # A changed config restarts the collector: it does not read the file again on its own.
        # Bump the number together with any change of the ConfigMap above.
        config-version: "1"
    spec:
      containers:
        - name: otel-collector
          # The core distribution: OTLP in and out, batch, memory_limiter, health_check are all in it.
          image: otel/opentelemetry-collector:0.157.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-collector
