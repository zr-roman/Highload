# PgBouncer in front of the primary, run by CloudNativePG: the Service pg-pooler-rw, which Payments.Api and
# Ledger.Service connect to instead of pg-rw (docs/postgres-failover.md, «PgBouncer»).
#
# Why: when the primary changes, the clients' connections to PgBouncer stay open; only PgBouncer's own connections to
# the old primary break, and it opens new ones to the new primary, which the operator points it at. The services
# no longer lose their whole pools at once, nor exhaust them reconnecting. And the number of connections to
# PostgreSQL stays fixed however many replicas the HPA starts: each one a process of the server.
#
# Transaction mode: a server connection is a client's for the length of a transaction only. So nothing that outlives
# a transaction works through it, the session advisory locks of the leader election above all: those go to pg-rw
# directly (Payments.Api, ConnectionStrings__PaymentsLeader). Nor do startup parameters: the -c options of the
# connection strings (statement_timeout, idle_in_transaction_session_timeout) are dropped by PgBouncer:
# CloudNativePG always puts options and extra_float_digits into its ignore_startup_parameters. Their work is
# done by Command Timeout of Npgsql, which cancels a query through PgBouncer, and by idle_transaction_timeout here.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pg-pooler-rw
spec:
  cluster:
    name: pg
  type: rw
  # Two, on two nodes: the loss of a node takes one, and the clients reconnect to the other.
  instances: 2
  pgbouncer:
    poolMode: transaction
    parameters:
      # Clients: Payments.Api up to 4 replicas x 16, Ledger.Service 8, with room to spare.
      max_client_conn: "300"
      # Server connections per database and user, per PgBouncer: 2 x (20 payments + 20 ledger) = 80 of the 150
      # max_connections, leaving the rest to the leader locks, the operator and the replicas.
      default_pool_size: "20"
      # Npgsql sends its queries as prepared statements of the extended protocol; PgBouncer 1.21+ keeps track of them
      # per server connection in transaction mode.
      max_prepared_statements: "200"
      # A client idle inside a transaction for 15 s loses its connection, as idle_in_transaction_session_timeout did.
      idle_transaction_timeout: "15"
      # When the primary changes (docs/postgres-failover.md, «PgBouncer»). With the defaults the first drain through
      # the pooler failed 65 % of the payments, against 21 % straight to pg-rw: a query for a primary that is gone
      # waited in PgBouncer's queue for up to 120 s, holding its Npgsql connection, until the pools of the services
      # ran dry; and one failed login made PgBouncer refuse every client for 15 s without trying again.
      # A query waits for a server connection no longer than the client waits for its answer (Command Timeout 5 s)...
      query_wait_timeout: "3"
      # ...a failed login is tried again after a second, a connection that does not open is given up after 3 s...
      server_login_retry: "1"
      server_connect_timeout: "3"
      # ...and once the operator points PgBouncer at the new primary, connections to the old one are closed as soon
      # as their transaction ends, not when they are next used.
      server_fast_close: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-pooler
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  cnpg.io/poolerName: pg-pooler-rw
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
