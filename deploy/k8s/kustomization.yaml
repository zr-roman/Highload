# Stage 1 of the stand in Kubernetes (k3d): the four services, Kafka, Redis and the telemetry dashboard.
# PostgreSQL stays on the host (port 5433) and is reached as host.docker.internal.
#   synced by Argo CD from git (deploy/argocd/highload.yaml); by hand: kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: highload

labels:
  - pairs:
      app.kubernetes.io/part-of: payments-platform

resources:
  - namespace.yaml
  - kafka.yaml
  - redis.yaml
  - dashboard.yaml
  - bank-emulator.yaml
  - antifraud.yaml
  - payments-api.yaml
  - pdb.yaml
  - hpa.yaml
  - ledger-service.yaml
  - ingress.yaml
  - traefik.yaml

# The version of each service's image. The manifests say <name>:dev; the tag here replaces dev. A release changes it
# here and nowhere else (deploy/release.ps1): a new tag in git is what makes Argo CD roll the pods, since the same
# tag rebuilt would look unchanged. The tag is the commit the image was built from.
images:
  - name: payments-api
    newTag: dev
  - name: ledger-service
    newTag: dev
  - name: bank-emulator
    newTag: dev
  - name: antifraud
    newTag: dev

# The Postgres password is not here: the cluster is synced from git by Argo CD (deploy/argocd), and the password
# must not be in git. The Secret postgres is created once by hand from postgres.env (README, step 3): the Deployments
# refer to it by name.
