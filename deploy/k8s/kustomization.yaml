# Stage 1 of the stand in Kubernetes (k3d): the four services, Kafka, Redis and the telemetry dashboard.
# PostgreSQL stays on the host (port 5433) and is reached as host.docker.internal.
#   synced by Argo CD from git (deploy/argocd/highload.yaml); by hand: kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: highload

labels:
  - pairs:
      app.kubernetes.io/part-of: payments-platform

resources:
  - namespace.yaml
  - kafka.yaml
  - redis.yaml
  - dashboard.yaml
  - bank-emulator.yaml
  - antifraud.yaml
  - payments-api.yaml
  - pdb.yaml
  - hpa.yaml
  - ledger-service.yaml
  - ingress.yaml
  - traefik.yaml
  - otel-collector.yaml
  - monitors.yaml
  - alerts.yaml
  - postgres-sealed.yaml

# Grafana dashboards of the stand, from the JSON files in dashboards/. The Grafana sidecar picks up any ConfigMap
# labelled grafana_dashboard: "1" in any namespace (deploy/monitoring/values.yaml) and loads it without a restart.
# A dashboard changed in the Grafana UI cannot be saved there: export its JSON into dashboards/ and commit it.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/payments.json
      - dashboards/resilience.json
    options:
      # A fixed name: nothing refers to it, and a new name on every change would only leave old ConfigMaps behind.
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

# The image of each service. The manifests say <name>:dev; newName and newTag here replace them. A release changes them
# here and nowhere else: CI (.github/workflows/ci.yml, deploy/ci-release.py) for every service whose sources changed,
# or deploy/release.ps1 by hand. A new tag in git is what makes Argo CD roll the pods, since the same tag rebuilt would
# look unchanged. The tag is the commit the image was built from; newName appears with the first release to ghcr.io.
images:
  - name: payments-api
    newTag: dc297256aaaa
  - name: ledger-service
    newTag: f63d36eaa6d7
    newName: ghcr.io/zr-roman/ledger-service
  - name: bank-emulator
    newTag: f63d36eaa6d7
    newName: ghcr.io/zr-roman/bank-emulator
  - name: antifraud
    newTag: f63d36eaa6d7
    newName: ghcr.io/zr-roman/antifraud

# The Postgres password is in git only encrypted: postgres-sealed.yaml is a SealedSecret that the Sealed Secrets
# controller (deploy/argocd/sealed-secrets.yaml) turns into the Secret postgres the Deployments refer to. It is sealed
# from postgres.env, which stays out of git (README, step 3).
