# Ledger.Service (C#): consumes payments.captured and writes the double entry in batches.
#   kubectl -n highload port-forward svc/ledger-service 5200:8080   ->  balances and invariants on http://localhost:5200
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  # Up to 8 replicas make sense: the consumer group spreads the 8 partitions of payments.captured among them,
  # and each partition keeps a single writer.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: ledger-service:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ConnectionStrings__Ledger
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: ConnectionStrings__Ledger
            - name: ConnectionStrings__Kafka
              value: kafka:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dashboard:18889
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              memory: 512Mi
