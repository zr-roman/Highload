# Ledger.Service (C#): consumes payments.captured and writes the double entry in batches.
#   kubectl -n highload port-forward svc/ledger-service 5200:8080   ->  balances and invariants on http://localhost:5200
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  # Up to 8 replicas make sense: the consumer group spreads the 8 partitions of payments.captured among them,
  # and each partition keeps a single writer.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: ledger-service:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ConnectionStrings__Ledger
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: ConnectionStrings__Ledger
            - name: ConnectionStrings__Kafka
              value: kafka:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://dashboard:18889
            # 1 % of traces, as the load matrix runs the services (load/Matrix/Stand.cs): a trace of every request
            # is thousands of spans a second for the dashboard on the same laptop, and it shows in the latency.
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.01"
          ports:
            - name: http
              containerPort: 8080
          # startup: until the app has applied the schema and created the topic (Program.cs),
          # the other probes wait.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # readiness: Postgres only (Platform/HealthCheckEndpoints.cs): balances and invariants are read from it; with Kafka
          # down the journal stops growing, but it can still be read.
          # While it fails the pod gets no requests but keeps running; three failures in a row, so one slow check
          # under load does not take the pod out.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness: the process answers, no dependency checks: with Postgres down it would restart every pod at once,
          # and none could start again until Postgres came back.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              memory: 512Mi
