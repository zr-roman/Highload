# Ledger.Service (C#): consumes payments.captured and writes the double entry in batches.
#   kubectl -n highload port-forward svc/ledger-service 5200:8080   ->  balances and invariants on http://localhost:5200
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
  annotations:
    # Traefik gives up on a pod after 1 s without a connection, not 30 (traefik.yaml).
    traefik.ingress.kubernetes.io/service.serverstransport: highload-fast-dial@kubernetescrd
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  # Up to 8 replicas make sense: the consumer group spreads the 8 partitions of payments.captured among them,
  # and each partition keeps a single writer.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
    spec:
      # Counted from the start of preStop: 5 s of the pause, then up to 30 s for the app to stop (HostOptions.ShutdownTimeout
      # is 25 s in Platform, a margin before SIGKILL).
      terminationGracePeriodSeconds: 35
      # Restricted, as the Pod Security Standard of the namespace demands (namespace.yaml, docs/security.md).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: ledger-service
          image: ledger-service:dev
          imagePullPolicy: IfNotPresent
          env:
            # PostgreSQL in the cluster (postgres.yaml): pg-rw always points at the current primary. The password is the
            # one CloudNativePG generated for the owner app (Secret pg-app): it never leaves the cluster. Kubernetes puts
            # it into the connection string below through $(PG_PASSWORD).
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: password
            - name: ConnectionStrings__Ledger
              value: Host=pg-rw;Port=5432;Database=ledger;Username=app;Password=$(PG_PASSWORD);Maximum Pool Size=8;Minimum Pool Size=8;Options=-c idle_in_transaction_session_timeout=15s -c statement_timeout=10s
            - name: ConnectionStrings__Kafka
              value: kafka:9092
            # To the OpenTelemetry Collector (otel-collector.yaml), which sends metrics on to Prometheus and everything
            # to the Aspire dashboard.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            # Metrics every 15 s, as often as Prometheus scrapes the rest; the default of 60 s draws one point a minute.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # The pod's name as the instance in telemetry (src/Platform/TelemetryExtensions.cs): a container restarted
            # in the same pod continues its series in Prometheus instead of starting new ones.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 1 % of traces, as the load matrix runs the services (load/Matrix/Stand.cs): a trace of every request
            # is thousands of spans a second for the dashboard on the same laptop, and it shows in the latency.
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.01"
          ports:
            - name: http
              containerPort: 8080
          # startup: until the app has applied the schema and created the topic (Program.cs),
          # the other probes wait.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # readiness: Postgres only (Platform/HealthCheckEndpoints.cs): balances and invariants are read from it; with Kafka
          # down the journal stops growing, but it can still be read.
          # While it fails the pod gets no requests but keeps running; three failures in a row, so one slow check
          # under load does not take the pod out.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness: the process answers, no dependency checks: with Postgres down it would restart every pod at once,
          # and none could start again until Postgres came back.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Kubernetes removes the pod from the Service and sends SIGTERM at the same moment, but Traefik learns of the
          # removal later and keeps sending requests for a while: the pod keeps serving them for 5 more seconds and
          # gets SIGTERM only after that. The sleep action, not exec sleep: the chiseled image has no shell and no sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Restricted (docs/security.md): the process cannot gain privileges beyond those it starts with.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The one writable place: /tmp, for the runtime's own files (.NET diagnostics, Python temp files).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              memory: 512Mi
