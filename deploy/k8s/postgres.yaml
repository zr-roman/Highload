# PostgreSQL of the stand, run by CloudNativePG (deploy/argocd/cnpg.yaml): three instances on three nodes, one
# primary and two replicas. The services connect to the Service pg-rw, which always points at the current primary.
#
# Synchronous replication, ANY 1 of the two replicas: a COMMIT returns only after one replica has the transaction
# too. When the primary dies, the operator promotes a replica, and a payment the client was told about is on it.
# dataDurability: required, not preferred: with preferred, writes go on without a synchronous replica when none is
# there, and a second failure then loses them. Three instances are what make required affordable: when one is gone,
# the remaining replica keeps the primary writable. With two, required would stop writes until the dead node
# returned, and preferred would trade that for the risk of losing payments.
#
# The cost: every COMMIT waits for a replica's flush, a few milliseconds more per payment (docs/postgres-failover.md).
#
# Backups: the WAL archive and daily base backups to the object store, through the Barman Cloud plugin (backups.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 3
  # PostgreSQL itself: the default image of the operator version, pinned with the chart (deploy/argocd/cnpg.yaml).

  postgresql:
    parameters:
      shared_buffers: 256MB
      # Payments.Api: up to 4 replicas x 16 connections, Ledger.Service 8, plus the operator and the replicas.
      max_connections: "150"
      # A WAL segment goes to the archive when it is full, 16 MB. Under a light load that can take hours, and all that
      # time the transactions in it are not in the backup. archive_timeout closes the segment after a minute at most,
      # if anything was written: the RPO of a recovery from backup is about a minute (backups.yaml).
      archive_timeout: 60s
    synchronous:
      method: any
      number: 1
      dataDurability: required

  # The WAL archive and the base backups go to the ObjectStore pg-backups (backups.yaml). The plugin adds its sidecar
  # to every instance: changing this list restarts the instances one by one, and the primary last, with a switchover.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-backups

  # The database of Payments.Api; the one of Ledger.Service is the Database below. Owner app, password in the
  # Secret pg-app, generated by the operator: the password never exists outside the cluster.
  bootstrap:
    initdb:
      database: payments
      owner: app
  # No superuser over the network: the services own their databases and need nothing more.
  enableSuperuserAccess: false

  # One instance per node: a node going down takes one instance, never the primary and its synchronous replica.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  # local-path of k3s: a volume on the node's disk. It does not move with the pod; an instance whose node is gone
  # waits for the node, and the others carry on.
  storage:
    size: 2Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-ledger
spec:
  cluster:
    name: pg
  name: ledger
  owner: app
