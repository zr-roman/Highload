apiVersion: v1
kind: Namespace
metadata:
  name: highload
  labels:
    # Pod Security Admission: the API server refuses a pod that does not meet the restricted profile (root, extra
    # capabilities, privilege escalation, no seccomp). The manifests meet it (docs/security.md); this keeps it so.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
