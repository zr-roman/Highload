# The antifraud check (Python): Payments.Api calls it once the bank has approved a payment (PaymentSaga, stage 4).
apiVersion: v1
kind: Service
metadata:
  name: antifraud
  labels:
    app.kubernetes.io/name: antifraud
spec:
  selector:
    app.kubernetes.io/name: antifraud
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: antifraud
  labels:
    app.kubernetes.io/name: antifraud
spec:
  # Two, on two nodes: every payment asks antifraud, and its state is in Redis, so any replica answers for any merchant.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: antifraud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: antifraud
    spec:
      # The replicas on different nodes, as in payments-api.yaml: a node going down takes one of them.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: antifraud
      # Restricted, as the Pod Security Standard of the namespace demands (namespace.yaml, docs/security.md).
      # The image names its user (USER antifraud), Kubernetes needs the number to check it is not root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: antifraud
          image: antifraud:dev
          imagePullPolicy: IfNotPresent
          env:
            # The Sentinels say which copy of Redis is the master now (redis.yaml); ANTIFRAUD_REDIS_URL, a single
            # Redis, is for docker-compose.yml and the local run.
            - name: ANTIFRAUD_REDIS_SENTINELS
              value: redis-0.redis:26379,redis-1.redis:26379,redis-2.redis:26379
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Restricted (docs/security.md): the process cannot gain privileges beyond those it starts with.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The one writable place: /tmp, for the runtime's own files (.NET diagnostics, Python temp files).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            # 250m, not 100m: when the laptop's processor is short, the kernel shares it out by the requests, and
            # the check is on the path of every payment the bank approves. At 50 payments a second a pod took up
            # to 170m.
            requests:
              cpu: 250m
              memory: 96Mi
            limits:
              memory: 256Mi
