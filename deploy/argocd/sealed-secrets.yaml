# Sealed Secrets: the passwords of the stand live in git encrypted (SealedSecret), and only this controller can turn
# them back into Secrets. It holds the private key; kubeseal on the laptop encrypts with the public one.
# Installed by Argo CD from the Helm chart. Applied once by hand, like highload.yaml and monitoring.yaml:
#   kubectl apply -f deploy/argocd/sealed-secrets.yaml
#
# The private key exists only in the cluster (Secret in kube-system, label sealedsecrets.bitnami.com/sealed-secrets-key).
# A new cluster gets a new key and cannot open the SealedSecrets in git: back the key up outside git, or seal the
# passwords again (deploy/k8s/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # A fixed version, like kube-prometheus-stack in monitoring.yaml.
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # The name and namespace kubeseal looks for by default: no --controller-name / --controller-namespace.
        fullnameOverride: sealed-secrets-controller
        # On the server node with the rest of the infrastructure: the experiments stop agent nodes, and a controller
        # on a dead node cannot restore a deleted Secret.
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRD of SealedSecret, like those of the Prometheus Operator (monitoring.yaml).
      - ServerSideApply=true
