# Strimzi: the operator that runs Kafka in the cluster (deploy/k8s/kafka.yaml), as CloudNativePG runs PostgreSQL.
# It creates the brokers from the Kafka and KafkaNodePool resources, rolls them one at a time and only when every
# partition stays in sync on the others, and keeps the topics declared as KafkaTopic resources.
# Installed by Argo CD from the Helm chart. Applied once by hand, like the other applications:
#   kubectl apply -f deploy/argocd/strimzi.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    # A fixed version, like the other charts. Strimzi 1.3.1 runs Kafka up to 4.3.2.
    targetRevision: 1.3.1
    helm:
      releaseName: strimzi
      valuesObject:
        # The operator lives in its own namespace and manages Kafka in highload only.
        watchNamespaces: [highload]
        # The pods it creates meet the Pod Security Standard restricted of highload (namespace.yaml): without this
        # Strimzi uses its baseline provider, and the API server refuses the brokers.
        extraEnvs:
          - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
            value: restricted
        # On the server node with the rest of the infrastructure: the experiments stop agent nodes, and the operator
        # is the one that has to react when they do.
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 384Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs of Strimzi are too large for client-side apply, like those of CloudNativePG.
      - ServerSideApply=true
